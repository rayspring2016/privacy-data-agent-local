<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Source Sans Pro", "PingFang SC", sans-serif; background: #fff; padding: 20px; }
  .section-title { font-size: 11px; font-weight: 600; color: #808495; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; margin-top: 16px; }
  .demo-block { background: #fafafa; border: 1px solid #e6e9ef; border-radius: 6px; padding: 14px; margin-bottom: 10px; }
  .demo-label { font-size: 10px; color: #bbbccc; font-family: monospace; margin-top: 8px; }

  .tab-bar { display: flex; gap: 0; border-bottom: 2px solid #e6e9ef; }
  .tab { padding: 8px 20px; font-size: 0.9rem; font-weight: 600; color: #808495; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.12s, border-color 0.12s; }
  .tab.active { color: #ff4b4b; border-bottom-color: #ff4b4b; }
  .tab:hover { color: #262730; }

  .tab-content { padding: 16px 0; font-size: 0.875rem; color: #262730; }

  .caption { font-size: 0.8125rem; color: #6b6b6b; margin-top: 4px; }

  .divider { height: 1px; background: #e6e9ef; margin: 14px 0; }

  /* Radio group (horizontal) */
  .radio-group { display: flex; gap: 20px; }
  .radio-item { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.875rem; color: #262730; }
  .radio-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #d0d3e0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .radio-dot.selected { border-color: #ff4b4b; }
  .radio-dot.selected::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #ff4b4b; }
</style>
</head>
<body>

<div class="section-title">st.radio — horizontal tab switcher</div>
<div class="demo-block">
  <div class="radio-group">
    <label class="radio-item">
      <div class="radio-dot selected"></div>
      数据脱敏
    </label>
    <label class="radio-item">
      <div class="radio-dot"></div>
      报告反脱敏
    </label>
  </div>
  <div class="demo-label">st.radio(horizontal=True, label_visibility="collapsed") · tab 1 active</div>
</div>

<div class="section-title">Tab 2 active</div>
<div class="demo-block">
  <div class="radio-group">
    <label class="radio-item">
      <div class="radio-dot"></div>
      数据脱敏
    </label>
    <label class="radio-item">
      <div class="radio-dot selected"></div>
      报告反脱敏
    </label>
  </div>
  <div class="demo-label">tab 2 active · 报告反脱敏</div>
</div>

<div class="section-title">Full page layout context</div>
<div class="demo-block" style="background:#fff; max-width:500px;">
  <div style="font-size:2rem; font-weight:700; color:#1f1f1f; margin-bottom:4px;">本地数据脱敏工具</div>
  <div class="caption">文件只在本机处理，不会上传到服务器，也不会调用大模型。</div>
  <div style="margin-top:12px;">
    <div class="radio-group">
      <label class="radio-item"><div class="radio-dot selected"></div>数据脱敏</label>
      <label class="radio-item"><div class="radio-dot"></div>报告反脱敏</label>
    </div>
  </div>
  <div class="divider"></div>
  <div class="tab-content">— tab content area —</div>
  <div class="demo-label">full page header + tab + divider + content region</div>
</div>

</body>
</html>
